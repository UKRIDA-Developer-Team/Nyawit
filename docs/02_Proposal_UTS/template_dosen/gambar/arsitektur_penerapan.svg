<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Liberation Sans, Arial, sans-serif">
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#33475b"/></marker>
    <style>
      .k { fill:#f4f7fb; stroke:#33475b; stroke-width:1.5; }
      .t { font-weight:bold; font-size:14.5px; fill:#12263a; }
      .s { font-size:12px; fill:#33475b; }
      .h { font-weight:bold; font-size:13px; fill:#1f5f8b; }
      .a { stroke:#33475b; stroke-width:1.6; fill:none; marker-end:url(#p); }
    </style>
  </defs>
  <!-- Pelatihan -->
  <rect x="8" y="8" width="984" height="118" rx="12" fill="#fff" stroke="#cfd8e3"/>
  <text x="22" y="30" class="h">A. PELATIHAN (sekali jalan, di cloud)</text>
  <rect x="22" y="42" width="215" height="72" rx="9" class="k"/>
  <text x="129" y="64" text-anchor="middle" class="t">Dataset Mendeley</text>
  <text x="129" y="84" text-anchor="middle" class="s">4.728 foto, SHA-256 dicek</text>
  <text x="129" y="101" text-anchor="middle" class="s">audit + split blok</text>
  <rect x="267" y="42" width="285" height="72" rx="9" class="k" style="stroke:#2f7a4f;stroke-width:2"/>
  <text x="409" y="64" text-anchor="middle" class="t">Google Colab · GPU NVIDIA T4</text>
  <text x="409" y="84" text-anchor="middle" class="s">PyTorch: E2–E7 × 3 seed (18 run)</text>
  <text x="409" y="101" text-anchor="middle" class="s">± 8–12 menit per run</text>
  <rect x="582" y="42" width="190" height="72" rx="9" class="k"/>
  <text x="677" y="64" text-anchor="middle" class="t">Google Drive</text>
  <text x="677" y="84" text-anchor="middle" class="s">best.pt (± 16 MB),</text>
  <text x="677" y="101" text-anchor="middle" class="s">log, tabel hasil</text>
  <rect x="802" y="42" width="178" height="72" rx="9" class="k"/>
  <text x="891" y="64" text-anchor="middle" class="t">Repositori</text>
  <text x="891" y="84" text-anchor="middle" class="s">kode, konfigurasi,</text>
  <text x="891" y="101" text-anchor="middle" class="s">results/ (tanpa data)</text>
  <path d="M237,78 L265,78" class="a"/><path d="M552,78 L580,78" class="a"/><path d="M772,78 L800,78" class="a"/>

  <!-- Penerapan -->
  <rect x="8" y="138" width="984" height="184" rx="12" fill="#fff" stroke="#cfd8e3"/>
  <text x="22" y="160" class="h">B. PENERAPAN (setiap kali pengguna mengirim foto)</text>
  <rect x="22" y="174" width="190" height="96" rx="9" class="k"/>
  <text x="117" y="198" text-anchor="middle" class="t">Pengguna</text>
  <text x="117" y="218" text-anchor="middle" class="s">browser ponsel/laptop</text>
  <text x="117" y="236" text-anchor="middle" class="s">unggah foto TBS</text>
  <text x="117" y="254" text-anchor="middle" class="s">(tanpa instal aplikasi)</text>
  <rect x="242" y="174" width="220" height="96" rx="9" class="k"/>
  <text x="352" y="198" text-anchor="middle" class="t">Server web Gradio</text>
  <text x="352" y="218" text-anchor="middle" class="s">Python, berjalan di laptop</text>
  <text x="352" y="236" text-anchor="middle" class="s">(CPU Ryzen 5 5600)</text>
  <text x="352" y="254" text-anchor="middle" class="s">atau Hugging Face Spaces</text>
  <rect x="492" y="174" width="270" height="96" rx="9" class="k" style="stroke:#2f7a4f;stroke-width:2"/>
  <text x="627" y="198" text-anchor="middle" class="t">Predictor (PyTorch, CPU)</text>
  <text x="627" y="218" text-anchor="middle" class="s">resize 256 → crop 224 → normalisasi</text>
  <text x="627" y="236" text-anchor="middle" class="s">EfficientNet-B0 + CORN (best.pt)</text>
  <text x="627" y="254" text-anchor="middle" class="s">+ Grad-CAM + ukur latensi</text>
  <rect x="792" y="174" width="188" height="96" rx="9" class="k"/>
  <text x="886" y="198" text-anchor="middle" class="t">Respons</text>
  <text x="886" y="218" text-anchor="middle" class="s">tingkat 0–4, peluang,</text>
  <text x="886" y="236" text-anchor="middle" class="s">peta panas, latensi,</text>
  <text x="886" y="254" text-anchor="middle" class="s">peringatan keyakinan</text>
  <path d="M212,222 L240,222" class="a"/><path d="M462,222 L490,222" class="a"/><path d="M762,222 L790,222" class="a"/>
  <text x="22" y="300" class="s">Cadangan bila web bermasalah: perintah baris <tspan font-family="Liberation Mono, monospace">scripts/predict.py</tspan> pada laptop yang sama (tanpa internet).</text>
  <text x="22" y="316" class="s" fill="#4a5d70">Pengembangan lanjutan (di luar cakupan semester ini): aplikasi ponsel luring (ONNX/TFLite) untuk kebun tanpa sinyal.</text>
  <path d="M677,114 C677,150 627,150 627,172" class="a" stroke-dasharray="5,4"/>
  <text x="690" y="152" class="s" fill="#4a5d70">bobot model</text>
</svg>
